[project]
name = "nastran95"
version = "0.3"
description = "NASTRAN-95 finite element analysis with Python wrapper"
requires-python = ">=3.12"
license = "NASA-1.3"
readme = "python/README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Fortran",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/spookylukey/NASTRAN-95"
Repository = "https://github.com/spookylukey/NASTRAN-95"
Tracker = "https://github.com/spookylukey/NASTRAN-95/issues"

[project.optional-dependencies]
pynastran = [
    "pyNastran>=1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that run NASTRAN (may take several seconds)",
]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "pyright>=1.1",
    "pre-commit>=3.0",
    "meson>=1.10.2",
    "ninja>=1.13.0",
]

[tool.hatch.build]
packages = ["python/nastran95"]

[tool.hatch.build.targets.wheel]
packages = ["python/nastran95"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# ── cibuildwheel ───────────────────────────────────────────────────────
[tool.cibuildwheel]
build = ["cp312-manylinux_x86_64", "cp313-manylinux_x86_64", "cp312-win_amd64", "cp313-win_amd64"]
test-requires = ["pytest"]
test-command = "python -c \"import subprocess, sys, nastran95; from nastran95._data import get_executable; exe = get_executable(); assert exe is not None, 'bundled binary missing'; r = subprocess.run([str(exe)], capture_output=True, timeout=5); assert r.returncode != -11, f'nastrn segfaults (signal 11)'; assert r.returncode != 3221225781, f'nastrn cannot find DLLs (0xC0000135) - not statically linked'; print(f'nastran95 - binary at {exe}, rc={r.returncode} ok')\""

[tool.cibuildwheel.linux]
# Install gfortran + make, then compile nastrn once (before-all runs once per
# container). The Makefile links with -static-libgfortran -static-libgcc so
# the binary only depends on libc/libm (in the manylinux allowlist), avoiding
# auditwheel needing to patch the ELF executable (which corrupts it).
before-all = [
    "yum install -y gcc-gfortran make || apk add gfortran make || (apt-get update && apt-get install -y gfortran make)",
    "make -C build",
    "ldd build/nastrn && ! ldd build/nastrn | grep -q libgfortran || { echo 'ERROR: nastrn still links libgfortran dynamically'; exit 1; }",
]
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel} || cp {wheel} {dest_dir}/"

[tool.cibuildwheel.windows]
# Install MinGW and compile with -static so the exe has no DLL dependencies
# beyond KERNEL32/msvcrt (in particular, no libquadmath-0.dll).
before-all = [
    "choco install mingw -y",
    "mingw32-make -C build FC=gfortran LFLAGS=-static",
]
